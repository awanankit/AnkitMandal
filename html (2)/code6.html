<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Air Striker</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #140f35 0%, #090d1d 45%, #040912 100%);
      font-family: Arial, sans-serif;
      color: white;
    }

    .game-wrap {
      position: relative;
      width: 820px;
      max-width: 92vw;
      border: 3px solid rgba(255,255,255,0.18);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0,0,0,0.52), inset 0 0 35px rgba(122, 205, 255, 0.16);
      background: #0c1325;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: linear-gradient(#75d6ff 0%, #bfefff 34%, #ecfbff 100%);
      border-radius: 12px;
    }

    .hud {
      position: absolute;
      inset: 0 auto auto 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      pointer-events: none;
      font-weight: bold;
      letter-spacing: 1px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
      z-index: 2;
    }

    .badge {
      background: rgba(10, 20, 32, 0.42);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 9px 14px;
      border-radius: 999px;
      backdrop-filter: blur(6px);
      box-shadow: inset 0 0 16px rgba(255,255,255,0.08);
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      background: linear-gradient(180deg, rgba(7, 14, 26, 0.6), rgba(7, 14, 26, 0.82));
      text-align: center;
      padding: 20px;
      z-index: 3;
    }

    .overlay.show {
      display: grid;
    }

    .overlay > div {
      background: rgba(14, 25, 42, 0.48);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 28px 30px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.25);
      backdrop-filter: blur(8px);
    }

    .overlay h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: 1px;
      text-shadow: 0 2px 18px rgba(97, 187, 255, 0.6);
    }

    .overlay p {
      margin: 0 0 20px;
      color: #dcecff;
      font-size: 1.05rem;
      max-width: 420px;
      line-height: 1.5;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      background: linear-gradient(135deg, #ffca3a, #ff8e3c);
      color: #fff;
      box-shadow: 0 12px 24px rgba(255, 142, 60, 0.38);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    button:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 18px 30px rgba(255, 142, 60, 0.45);
    }
  </style>
</head>
<body>
  <div class="game-wrap">
    <div class="hud">
      <div class="badge">Score: <span id="score">0</span></div>
      <div class="badge">Lives: <span id="lives">3</span></div>
      <div class="badge">Wave: <span id="wave">1</span></div>
      <div class="badge">Weapon: <span id="weapon">Rifle</span></div>
    </div>
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div class="overlay" id="startOverlay">
      <div>
        <h1>Air Striker</h1>
        <p>Move with A/D or mouse. Press Space to shoot. Survive the enemy wave!</p>
        <button id="startBtn">Start Game</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const startOverlay = document.getElementById('startOverlay');
    const startBtn = document.getElementById('startBtn');

    let gameStarted = false;
    let gameOver = false;
    let score = 0;
    let lives = 5;
    let wave = 1;
    let combo = 0;
    let lastTime = 0;
    let spawnTimer = 0;
    let keys = {};
    let mouseX = canvas.width / 2;
    let audioCtx = null;

    const waveEl = document.getElementById('wave');
    const weaponEl = document.getElementById('weapon');

    function ensureAudio() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return null;

      if (!audioCtx) {
        audioCtx = new AudioCtx();
      }

      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      return audioCtx;
    }

    function playTone({
      frequency = 440,
      duration = 0.12,
      type = 'square',
      volume = 0.08,
      slideTo = null,
      attack = 0.01,
      startAt = 0
    } = {}) {
      const ctxAudio = ensureAudio();
      if (!ctxAudio) return;

      const oscillator = ctxAudio.createOscillator();
      const gainNode = ctxAudio.createGain();

      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, ctxAudio.currentTime + startAt);
      if (slideTo) {
        oscillator.frequency.exponentialRampToValueAtTime(slideTo, ctxAudio.currentTime + startAt + duration);
      }

      gainNode.gain.setValueAtTime(0.0001, ctxAudio.currentTime + startAt);
      gainNode.gain.exponentialRampToValueAtTime(volume, ctxAudio.currentTime + startAt + attack);
      gainNode.gain.exponentialRampToValueAtTime(0.0001, ctxAudio.currentTime + startAt + duration);

      oscillator.connect(gainNode);
      gainNode.connect(ctxAudio.destination);

      oscillator.start(ctxAudio.currentTime + startAt);
      oscillator.stop(ctxAudio.currentTime + startAt + duration + 0.05);
    }

    function playShootSound() {
      playTone({
        frequency: 360,
        duration: 0.11,
        type: 'square',
        volume: 0.07,
        slideTo: 180
      });
    }

    function playHitSound() {
      playTone({
        frequency: 220,
        duration: 0.12,
        type: 'triangle',
        volume: 0.06,
        slideTo: 110
      });
    }

    function playPickupSound() {
      playTone({
        frequency: 680,
        duration: 0.1,
        type: 'triangle',
        volume: 0.08,
        slideTo: 880
      });
    }

    function playGameOverSound() {
      playTone({
        frequency: 180,
        duration: 0.22,
        type: 'sawtooth',
        volume: 0.07,
        slideTo: 70
      });
      setTimeout(() => {
        playTone({
          frequency: 110,
          duration: 0.28,
          type: 'sawtooth',
          volume: 0.06,
          slideTo: 45
        });
      }, 120);
    }

    const player = {
      x: canvas.width / 2,
      y: canvas.height - 50,
      width: 96,
      height: 40,
      speed: 8,
      cooldown: 0,
      fireLevel: 1,
      rapidTimer: 0,
      shieldTimer: 0
    };

    let bullets = [];
    let enemies = [];
    let clouds = [];
    let pickups = [];
    let particles = [];

    function initClouds() {
      clouds = [];
      for (let i = 0; i < 20; i++) {
        clouds.push({
          x: Math.random() * canvas.width,
          y: 30 + Math.random() * canvas.height * 0.5,
          r: 18 + Math.random() * 24,
          speed: 0.4 + Math.random() * 0.7
        });
      }
    }

    function resetGame() {
      gameOver = false;
      score = 0;
      lives = 5;
      combo = 0;
      bullets = [];
      enemies = [];
      pickups = [];
      particles = [];
      player.x = canvas.width / 2;
      player.y = canvas.height - 50;
      player.cooldown = 0;
      player.fireLevel = 1;
      player.rapidTimer = 0;
      player.shieldTimer = 0;
      spawnTimer = 0;
      updateHud();
      startOverlay.classList.remove('show');
    }

    function updateHud() {
      wave = 1 + Math.floor(score / 120);
      scoreEl.textContent = score;
      livesEl.textContent = lives;
      waveEl.textContent = wave;

      if (player.shieldTimer > 0) weaponEl.textContent = 'Shield';
      else if (player.rapidTimer > 0) weaponEl.textContent = 'Rapid';
      else if (player.fireLevel >= 3) weaponEl.textContent = 'Scatter';
      else if (player.fireLevel >= 2) weaponEl.textContent = 'Twin';
      else weaponEl.textContent = 'Rifle';
    }

    function spawnParticles(x, y, color, count = 10) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x,
          y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          life: 0.5 + Math.random() * 0.6,
          color,
          r: 2 + Math.random() * 3
        });
      }
    }

    function spawnPickup(x, y) {
      if (Math.random() > 0.22) return;
      const types = ['rapid', 'shield', 'repair'];
      const type = types[Math.floor(Math.random() * types.length)];
      pickups.push({
        x,
        y,
        r: 11,
        speed: 1.1 + Math.random() * 0.8,
        drift: (Math.random() - 0.5) * 1.4,
        type
      });
    }

    function spawnEnemy() {
      const difficulty = 1 + score / 120;
      const roll = Math.random();
      let type = 'drone';
      if (roll > 0.82) type = 'tank';
      else if (roll > 0.52) type = 'zigzag';

      const baseSize = 28 + Math.random() * 22;
      const width = type === 'tank' ? baseSize * 1.5 : baseSize;
      const height = type === 'tank' ? baseSize * 1.2 : baseSize * 0.8;

      enemies.push({
        x: 30 + Math.random() * (canvas.width - 60),
        y: -35,
        width,
        height,
        speed: (type === 'tank' ? 0.8 : 1.1) + Math.random() * 0.9 + difficulty * 0.2,
        drift: (Math.random() - 0.5) * 1.8,
        type,
        hp: type === 'tank' ? 2 : 1,
        phase: Math.random() * Math.PI * 2
      });
    }

    function shoot() {
      if (!gameStarted || gameOver) return;
      if (player.cooldown > 0) return;

      playShootSound();
      const offsets = player.fireLevel >= 3 ? [-18, -9, 0, 9, 18] : player.fireLevel >= 2 ? [-10, 0, 10] : [0];
      const aimX = mouseX !== undefined ? mouseX - player.x : 0;
      const drift = Math.abs(aimX) > 10 ? Math.sign(aimX) * 0.35 : 0;
      const quickFire = player.rapidTimer > 0 ? 0.08 : 0.14;

      for (const offset of offsets) {
        bullets.push({
          x: player.x + offset,
          y: player.y - 18,
          r: 5.5,
          speed: 10,
          vx: drift + offset * 0.06,
          vy: -1
        });
      }
      player.cooldown = quickFire;
    }

    function updatePlayer(dt) {
      if (keys['ArrowLeft'] || keys['a']) player.x -= player.speed;
      if (keys['ArrowRight'] || keys['d']) player.x += player.speed;

      if (mouseX !== undefined) {
        const dx = mouseX - player.x;
        if (Math.abs(dx) > 3) {
          player.x += dx * 0.12;
        }
      }

      player.x = Math.max(28, Math.min(canvas.width - 28, player.x));
      player.cooldown = Math.max(0, player.cooldown - dt);
      player.rapidTimer = Math.max(0, player.rapidTimer - dt);
      player.shieldTimer = Math.max(0, player.shieldTimer - dt);
      player.fireLevel = Math.min(3, 1 + Math.floor(score / 140));
    }

    function updateBullets(dt) {
      for (let i = bullets.length - 1; i >= 0; i--) {
        const bullet = bullets[i];
        bullet.x += bullet.vx * bullet.speed * dt * 60;
        bullet.y += bullet.vy * bullet.speed * dt * 60;

        if (bullet.y < -20 || bullet.x < -30 || bullet.x > canvas.width + 30) {
          bullets.splice(i, 1);
        }
      }
    }

    function updatePickups(dt) {
      for (let i = pickups.length - 1; i >= 0; i--) {
        const pickup = pickups[i];
        pickup.y += pickup.speed * dt * 60;
        pickup.x += pickup.drift * dt * 60;

        if (pickup.x < 12) pickup.x = 12;
        if (pickup.x > canvas.width - 12) pickup.x = canvas.width - 12;

        const taken = Math.abs(pickup.x - player.x) < (player.width * 0.4 + pickup.r) &&
          Math.abs(pickup.y - player.y) < (player.height * 0.5 + pickup.r);

        if (taken) {
          pickups.splice(i, 1);
          playPickupSound();

          if (pickup.type === 'rapid') {
            player.rapidTimer = 7;
          } else if (pickup.type === 'shield') {
            player.shieldTimer = 8;
          } else {
            lives = Math.min(5, lives + 1);
          }
          updateHud();
          continue;
        }

        if (pickup.y > canvas.height + 20) {
          pickups.splice(i, 1);
        }
      }
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt * 60;
        p.y += p.vy * dt * 60;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function updateEnemies(dt) {
      for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];
        enemy.y += enemy.speed * dt * 60;

        if (enemy.type === 'zigzag') {
          enemy.x += Math.sin((enemy.phase += dt * 8)) * 1.8;
        } else {
          enemy.x += enemy.drift * dt * 60;
        }

        if (enemy.x < 18) enemy.x = 18;
        if (enemy.x > canvas.width - 18) enemy.x = canvas.width - 18;

        if (enemy.y > canvas.height + enemy.height) {
          enemies.splice(i, 1);
          lives -= 1;
          combo = 0;
          playHitSound();
          if (lives <= 0) {
            gameOver = true;
            playGameOverSound();
            showOverlay('Game Over', 'Final score: ' + score + ' — Tap to restart');
          }
          updateHud();
          continue;
        }

        const hit = Math.abs(enemy.x - player.x) < (enemy.width + player.width) * 0.45 &&
          Math.abs(enemy.y - player.y) < (enemy.height + player.height) * 0.5;

        if (hit) {
          if (player.shieldTimer > 0) {
            enemies.splice(i, 1);
            player.shieldTimer = Math.max(0, player.shieldTimer - 2);
            combo += 1;
            score += 8;
            spawnParticles(enemy.x, enemy.y, '#8fe9ff', 18);
            playHitSound();
            updateHud();
            continue;
          }

          enemies.splice(i, 1);
          combo = 0;
          lives -= 1;
          playHitSound();
          if (lives <= 0) {
            gameOver = true;
            playGameOverSound();
            showOverlay('Game Over', 'Final score: ' + score + ' — Tap to restart');
          }
          updateHud();
        }
      }
    }

    function checkCollisions() {
      for (let i = bullets.length - 1; i >= 0; i--) {
        const bullet = bullets[i];
        for (let j = enemies.length - 1; j >= 0; j--) {
          const enemy = enemies[j];
          if (
            bullet.x > enemy.x - enemy.width / 2 - 8 &&
            bullet.x < enemy.x + enemy.width / 2 + 8 &&
            bullet.y > enemy.y - enemy.height / 2 - 8 &&
            bullet.y < enemy.y + enemy.height / 2 + 8
          ) {
            bullet.hit = true;
            enemy.hp -= 1;

            if (enemy.hp <= 0) {
              enemies.splice(j, 1);
              score += 12 + wave * 2 + combo;
              combo += 1;
              spawnParticles(enemy.x, enemy.y, '#ff8b6b', 16);
              if (Math.random() < 0.22) spawnPickup(enemy.x, enemy.y);
            } else {
              score += 4;
              spawnParticles(enemy.x, enemy.y, '#ffc857', 8);
            }

            bullets.splice(i, 1);
            playHitSound();
            updateHud();
            break;
          }
        }
      }
    }

    function updateClouds() {
      for (const cloud of clouds) {
        cloud.x += cloud.speed;
        if (cloud.x > canvas.width + cloud.r) cloud.x = -cloud.r;
      }
    }

    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, '#7ad8ff');
      sky.addColorStop(0.48, '#d8f6ff');
      sky.addColorStop(1, '#eefcff');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const sunGlow = ctx.createRadialGradient(canvas.width - 120, 90, 15, canvas.width - 120, 90, 120);
      sunGlow.addColorStop(0, 'rgba(255,247,180,0.9)');
      sunGlow.addColorStop(0.4, 'rgba(255,214,102,0.45)');
      sunGlow.addColorStop(1, 'rgba(255,214,102,0)');
      ctx.fillStyle = sunGlow;
      ctx.fillRect(canvas.width - 220, 0, 220, 220);

      ctx.fillStyle = '#ffe98a';
      ctx.beginPath();
      ctx.arc(canvas.width - 120, 90, 34, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#9ad9b4';
      ctx.beginPath();
      ctx.moveTo(0, canvas.height - 60);
      ctx.lineTo(180, canvas.height - 160);
      ctx.lineTo(350, canvas.height - 80);
      ctx.lineTo(520, canvas.height - 170);
      ctx.lineTo(680, canvas.height - 90);
      ctx.lineTo(canvas.width, canvas.height - 140);
      ctx.lineTo(canvas.width, canvas.height);
      ctx.lineTo(0, canvas.height);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#7ec870';
      ctx.fillRect(0, canvas.height - 22, canvas.width, 22);

      for (const cloud of clouds) {
        ctx.beginPath();
        ctx.fillStyle = 'rgba(255,255,255,0.82)';
        ctx.arc(cloud.x, cloud.y, cloud.r, 0, Math.PI * 2);
        ctx.arc(cloud.x + cloud.r * 0.8, cloud.y + 6, cloud.r * 0.9, 0, Math.PI * 2);
        ctx.arc(cloud.x - cloud.r * 0.8, cloud.y + 4, cloud.r * 0.75, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawPlayer() {
      const x = player.x;
      const y = player.y;
      const w = player.width;
      const h = player.height;

      if (player.shieldTimer > 0) {
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(119, 226, 255, 0.9)';
        ctx.lineWidth = 3;
        ctx.arc(x, y, 52, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.save();
      ctx.translate(x, y);

      ctx.fillStyle = 'rgba(18, 38, 70, 0.26)';
      ctx.beginPath();
      ctx.ellipse(0, 18, 36, 16, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ff7b54';
      ctx.beginPath();
      ctx.moveTo(-w * 0.52, 0);
      ctx.lineTo(-w * 0.18, -h * 0.15);
      ctx.lineTo(w * 0.2, -h * 0.75);
      ctx.lineTo(w * 0.62, -h * 0.18);
      ctx.lineTo(w * 0.36, h * 0.62);
      ctx.lineTo(-w * 0.32, h * 0.72);
      ctx.lineTo(-w * 0.66, h * 0.12);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#0d1d35';
      ctx.beginPath();
      ctx.moveTo(-w * 0.18, -h * 0.12);
      ctx.lineTo(w * 0.16, -h * 0.36);
      ctx.lineTo(w * 0.52, -h * 0.08);
      ctx.lineTo(w * 0.18, h * 0.38);
      ctx.lineTo(-w * 0.12, h * 0.38);
      ctx.lineTo(-w * 0.46, -h * 0.02);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#8ed9ff';
      ctx.beginPath();
      ctx.moveTo(-w * 0.08, -h * 0.18);
      ctx.lineTo(w * 0.32, -h * 0.12);
      ctx.lineTo(w * 0.22, h * 0.08);
      ctx.lineTo(-w * 0.06, h * 0.08);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#122a4d';
      ctx.fillRect(-w * 0.28, -h * 0.08, w * 0.18, h * 0.38);
      ctx.fillRect(w * 0.1, -h * 0.08, w * 0.18, h * 0.38);

      ctx.fillStyle = '#ffd166';
      ctx.fillRect(-7, -h * 0.76, 14, 18);

      ctx.fillStyle = '#ff5b57';
      ctx.beginPath();
      ctx.moveTo(-w * 0.62, -0.06);
      ctx.lineTo(-w * 0.82, h * 0.16);
      ctx.lineTo(-w * 0.5, h * 0.3);
      ctx.lineTo(-w * 0.2, 0);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(w * 0.62, -0.06);
      ctx.lineTo(w * 0.82, h * 0.16);
      ctx.lineTo(w * 0.5, h * 0.3);
      ctx.lineTo(w * 0.2, 0);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#ffb703';
      ctx.beginPath();
      ctx.moveTo(-8, h * 0.58);
      ctx.lineTo(0, h * 0.98);
      ctx.lineTo(8, h * 0.58);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#fefefe';
      ctx.fillRect(-w * 0.18, -h * 0.12, 10, 10);
      ctx.fillRect(w * 0.08, -h * 0.12, 10, 10);

      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-w * 0.22, -h * 0.3);
      ctx.lineTo(0, -h * 0.58);
      ctx.lineTo(w * 0.22, -h * 0.3);
      ctx.stroke();

      ctx.restore();
    }

    function drawBullets() {
      for (const bullet of bullets) {
        ctx.beginPath();
        ctx.fillStyle = '#ffb703';
        ctx.arc(bullet.x, bullet.y, bullet.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.fillStyle = 'rgba(255, 190, 55, 0.3)';
        ctx.arc(bullet.x, bullet.y + 10, bullet.r * 2.4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawPickups() {
      for (const pickup of pickups) {
        ctx.save();
        ctx.translate(pickup.x, pickup.y);
        ctx.fillStyle = pickup.type === 'rapid' ? '#ff9f1c' : pickup.type === 'shield' ? '#6ee7ff' : '#95f788';
        ctx.beginPath();
        ctx.arc(0, 0, pickup.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#0a1d2d';
        ctx.font = 'bold 12px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(pickup.type[0].toUpperCase(), 0, 1);
        ctx.restore();
      }
    }

    function drawEnemies() {
      for (const enemy of enemies) {
        ctx.save();
        ctx.translate(enemy.x, enemy.y);

        ctx.fillStyle = 'rgba(214, 40, 40, 0.25)';
        ctx.beginPath();
        ctx.ellipse(0, 22, 24, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#d62828';
        ctx.beginPath();
        ctx.moveTo(0, -enemy.height / 2);
        ctx.lineTo(enemy.width / 2, 0);
        ctx.lineTo(0, enemy.height / 2);
        ctx.lineTo(-enemy.width / 2, 0);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#f5d0d0';
        ctx.fillRect(-5, -enemy.height / 2 + 8, 10, 10);
        ctx.fillRect(-enemy.width / 2 + 10, 0, 8, 8);
        ctx.fillRect(enemy.width / 2 - 18, 0, 8, 8);

        ctx.restore();
      }
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.beginPath();
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function showOverlay(title, message) {
      const heading = startOverlay.querySelector('h1');
      const para = startOverlay.querySelector('p');
      heading.textContent = title;
      para.textContent = message;
      startOverlay.classList.add('show');
    }

    function gameLoop(ts) {
      const dt = (ts - lastTime) / 1000 || 0.016;
      lastTime = ts;

      if (gameStarted && !gameOver) {
        updateClouds();
        updatePlayer(dt);
        updateBullets(dt);
        updatePickups(dt);
        updateParticles(dt);
        spawnTimer += dt;

        if (spawnTimer > Math.max(0.7, 1.2 - score / 260)) {
          spawnTimer = 0;
          spawnEnemy();
        }

        updateEnemies(dt);
        checkCollisions();
      }

      drawBackground();
      drawPlayer();
      drawBullets();
      drawPickups();
      drawEnemies();
      drawParticles();

      requestAnimationFrame(gameLoop);
    }

    function startGame() {
      resetGame();
      gameStarted = true;
      playTone({
        frequency: 520,
        duration: 0.14,
        type: 'triangle',
        volume: 0.06,
        slideTo: 720
      });
      startOverlay.classList.remove('show');
    }

    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        shoot();
      }
    });

    window.addEventListener('keyup', e => {
      keys[e.key] = false;
    });

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      mouseX = ((e.clientX - rect.left) / rect.width) * canvas.width;
    });

    canvas.addEventListener('click', () => {
      if (!gameStarted) startGame();
      else if (gameOver) startGame();
      else shoot();
    });

    startBtn.addEventListener('click', () => {
      startGame();
    });

    initClouds();
    updateHud();
    showOverlay('Air Striker', 'Move with A/D or mouse. Press Space to shoot. Survive the enemy wave! Power-ups: rapid fire, shield, repair.');
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
