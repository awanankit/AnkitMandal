
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 3D Hand Tracker</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #02030c;
    font-family: Arial, sans-serif;
    color: white;
}

#scene {
    position: fixed;
    inset: 0;
}

.title {
    position: fixed;
    top: 25px;
    width: 100%;
    text-align: center;
    z-index: 5;
    pointer-events: none;
}

.title h1 {
    font-size: 30px;
    letter-spacing: 5px;
    color: #bceaff;
    text-shadow: 0 0 20px #00aaff;
}

.title p {
    margin-top: 10px;
    color: #8c9dbb;
    font-size: 12px;
    letter-spacing: 3px;
}

#cameraBox {
    position: fixed;
    bottom: 25px;
    right: 25px;
    width: 220px;
    height: 165px;
    border: 1px solid #00c8ff;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 0 25px #0088ff55;
    z-index: 10;
    background: #080d20;
}

#cameraBox video,
#cameraBox canvas {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
}

#status {
    position: fixed;
    bottom: 35px;
    left: 30px;
    font-size: 14px;
    color: #00eaff;
    z-index: 10;
    text-shadow: 0 0 12px #00aaff;
}

#instructions {
    position: fixed;
    left: 30px;
    top: 125px;
    color: #b3c7e8;
    font-size: 13px;
    line-height: 2.1;
    z-index: 5;
}

#startButton {
    position: fixed;
    top: 55%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    padding: 17px 35px;
    border: 1px solid #00d9ff;
    border-radius: 30px;
    background: #07162c;
    color: #8eeeff;
    font-size: 16px;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 0 30px #008cff66;
}

#startButton:hover {
    background: #06365a;
    box-shadow: 0 0 45px #00bfff;
}

@media(max-width:600px) {
    #cameraBox {
        width: 145px;
        height: 110px;
        bottom: 15px;
        right: 15px;
    }
    #instructions {
        top: 100px;
        left: 15px;
        font-size: 11px;
    }
}
</style>
</head>

<body>

<div id="scene"></div>

<div class="title">
    <h1>NEURAL PARTICLE UNIVERSE</h1>
    <p>AI HAND CONTROL SYSTEM</p>
</div>

<div id="instructions">
    🖐 OPEN HAND — EXPAND<br>
    ✊ CLOSE FIST — COLLECT<br>
    ↔ MOVE HAND — CONTROL<br>
    ✨ MOVE FINGERS — INTERACT
</div>

<div id="status">SYSTEM: WAITING FOR CAMERA</div>

<div id="cameraBox">
    <video id="video" autoplay playsinline></video>
    <canvas id="handCanvas"></canvas>
</div>

<button id="startButton">START AI EXPERIENCE</button>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">

import * as THREE from "three";

// ---------------- SCENE ----------------

const scene = new THREE.Scene();

scene.fog = new THREE.FogExp2(0x02030c, 0.025);

const camera3D = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera3D.position.z = 15;

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

document.getElementById("scene").appendChild(renderer.domElement);

// ---------------- PARTICLE SYSTEM ----------------

const PARTICLE_COUNT = 25000;

const geometry = new THREE.BufferGeometry();

const positions = new Float32Array(PARTICLE_COUNT * 3);
const original = new Float32Array(PARTICLE_COUNT * 3);
const colors = new Float32Array(PARTICLE_COUNT * 3);

const randoms = new Float32Array(PARTICLE_COUNT);

for (let i = 0; i < PARTICLE_COUNT; i++) {

    const i3 = i * 3;

    const u = Math.random() * 2 - 1;
    const theta = Math.random() * Math.PI * 2;

    const r = Math.sqrt(1 - u * u);

    const x = r * Math.cos(theta);
    const y = u;
    const z = r * Math.sin(theta);

    original[i3] = x;
    original[i3 + 1] = y;
    original[i3 + 2] = z;

    positions[i3] = x * 2;
    positions[i3 + 1] = y * 2;
    positions[i3 + 2] = z * 2;

    const color = new THREE.Color();
    color.setHSL(
        0.53 + Math.random() * 0.17,
        1,
        0.5 + Math.random() * 0.3
    );

    colors[i3] = color.r;
    colors[i3 + 1] = color.g;
    colors[i3 + 2] = color.b;

    randoms[i] = Math.random();
}

geometry.setAttribute(
    "position",
    new THREE.BufferAttribute(positions, 3)
);

geometry.setAttribute(
    "color",
    new THREE.BufferAttribute(colors, 3)
);

const material = new THREE.PointsMaterial({
    size: 0.035,
    vertexColors: true,
    transparent: true,
    opacity: 0.9,
    blending: THREE.AdditiveBlending,
    depthWrite: false
});

const particles = new THREE.Points(geometry, material);
scene.add(particles);

// ---------------- ENERGY CORE ----------------

const coreGeometry = new THREE.SphereGeometry(0.45, 32, 32);

const coreMaterial = new THREE.MeshBasicMaterial({
    color: 0x00bfff,
    transparent: true,
    opacity: 0.22,
    wireframe: true
});

const core = new THREE.Mesh(coreGeometry, coreMaterial);
scene.add(core);

// Energy rings

const rings = [];

for (let i = 0; i < 4; i++) {

    const ringGeometry = new THREE.TorusGeometry(
        2.2 + i * 0.5,
        0.012,
        8,
        120
    );

    const ringMaterial = new THREE.MeshBasicMaterial({
        color: i % 2 ? 0x8b35ff : 0x00dfff,
        transparent: true,
        opacity: 0.5
    });

    const ring = new THREE.Mesh(ringGeometry, ringMaterial);

    ring.rotation.x = Math.random() * Math.PI;
    ring.rotation.y = Math.random() * Math.PI;

    scene.add(ring);
    rings.push(ring);
}

// ---------------- BACKGROUND STARS ----------------

const starGeometry = new THREE.BufferGeometry();
const starPositions = [];

for (let i = 0; i < 1800; i++) {
    starPositions.push(
        (Math.random() - 0.5) * 100,
        (Math.random() - 0.5) * 100,
        (Math.random() - 0.5) * 60
    );
}

starGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(starPositions, 3)
);

const stars = new THREE.Points(
    starGeometry,
    new THREE.PointsMaterial({
        color: 0x6688ff,
        size: 0.06,
        transparent: true,
        opacity: 0.7
    })
);

scene.add(stars);

// ---------------- HAND CONTROL VARIABLES ----------------

let handOpen = 0;
let targetOpen = 0;
let handX = 0;
let handY = 0;
let tracking = false;

// ---------------- ANIMATION ----------------

const clock = new THREE.Clock();

function animate() {

    requestAnimationFrame(animate);

    const time = clock.getElapsedTime();

    handOpen = THREE.MathUtils.lerp(
        handOpen,
        targetOpen,
        0.09
    );

    // Open hand expands the particle sphere.
    // Closed hand collects the particles.

    const radius = 1.1 + handOpen * 6.0;

    const pos = geometry.attributes.position.array;

    for (let i = 0; i < PARTICLE_COUNT; i++) {

        const i3 = i * 3;

        const wave =
            1 + 0.035 * Math.sin(time * 2 + randoms[i] * 15);

        const targetRadius =
            radius * wave * (0.96 + randoms[i] * 0.08);

        const tx = original[i3] * targetRadius;
        const ty = original[i3 + 1] * targetRadius;
        const tz = original[i3 + 2] * targetRadius;

        pos[i3] += (tx - pos[i3]) * 0.075;
        pos[i3 + 1] += (ty - pos[i3 + 1]) * 0.075;
        pos[i3 + 2] += (tz - pos[i3 + 2]) * 0.075;
    }

    geometry.attributes.position.needsUpdate = true;

    // Hand controls the universe position.

    particles.position.x += (handX * 5 - particles.position.x) * 0.05;
    particles.position.y += (handY * 4 - particles.position.y) * 0.05;

    core.position.copy(particles.position);
    core.scale.setScalar(0.7 + handOpen * 1.3);

    particles.rotation.y += 0.002;
    particles.rotation.x += 0.0008;

    core.rotation.y -= 0.01;

    rings.forEach((ring, i) => {
        ring.rotation.x += 0.001 * (i + 1);
        ring.rotation.y += 0.002 * (i + 1);
        ring.scale.setScalar(0.65 + handOpen * 1.2);
        ring.position.copy(particles.position);
    });

    stars.rotation.y += 0.00015;

    renderer.render(scene, camera3D);
}

animate();

// ---------------- AI HAND TRACKER ----------------

const video = document.getElementById("video");
const canvas = document.getElementById("handCanvas");
const ctx = canvas.getContext("2d");

const status = document.getElementById("status");
const startButton = document.getElementById("startButton");

canvas.width = 640;
canvas.height = 480;

const distance = (a, b) => {
    return Math.hypot(a.x - b.x, a.y - b.y);
};

function onResults(results) {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0) {

        tracking = true;

        const landmarks = results.multiHandLandmarks[0];

        // Draw hand skeleton.

        drawConnectors(
            ctx,
            landmarks,
            HAND_CONNECTIONS,
            { color: "#00eaff", lineWidth: 4 }
        );

        drawLandmarks(
            ctx,
            landmarks,
            { color: "#ffffff", lineWidth: 1, radius: 3 }
        );

        // Calculate hand openness.

        const wrist = landmarks[0];
        const palm = landmarks[9];

        const palmSize = distance(wrist, palm);

        const fingertips = [
            landmarks[8],
            landmarks[12],
            landmarks[16],
            landmarks[20]
        ];

        let average = 0;

        fingertips.forEach(tip => {
            average += distance(wrist, tip);
        });

        average /= fingertips.length;

        const openness = average / Math.max(palmSize, 0.001);

        targetOpen = THREE.MathUtils.clamp(
            (openness - 1.15) / 1.05,
            0,
            1
        );

        // Move particle universe with hand.

        handX = (0.5 - landmarks[9].x) * 2;
        handY = (0.5 - landmarks[9].y) * 2;

        status.innerText =
            targetOpen > 0.5
            ? "SYSTEM: HAND OPEN — EXPANDING"
            : "SYSTEM: HAND CLOSED — COLLECTING";

    } else {

        tracking = false;
        status.innerText = "SYSTEM: NO HAND DETECTED";
    }
}

// ---------------- START CAMERA ----------------

startButton.addEventListener("click", async () => {

    startButton.style.display = "none";

    status.innerText = "SYSTEM: STARTING CAMERA...";

    try {

        const hands = new Hands({
            locateFile: file =>
                `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.65
        });

        hands.onResults(onResults);

        const camera = new Camera(video, {
            onFrame: async () => {
                await hands.send({ image: video });
            },
            width: 640,
            height: 480
        });

        await camera.start();

        status.innerText = "SYSTEM: AI TRACKING ACTIVE";

    } catch (error) {

        console.error(error);

        status.innerText =
            "CAMERA ERROR — CHECK PERMISSIONS";

        startButton.style.display = "block";
    }
});

// ---------------- RESPONSIVE SCREEN ----------------

window.addEventListener("resize", () => {

    camera3D.aspect =
        window.innerWidth / window.innerHeight;

    camera3D.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});

</script>
</body>
</html>
