<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Colour Generator</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      transition: background 0.4s ease;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 18px;
      padding: 30px 25px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.18);
      width: 300px;
    }

    .color-box {
      width: 100%;
      height: 150px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 2px solid rgba(0, 0, 0, 0.1);
      background: #ffffff;
      transition: background 0.4s ease;
    }

    h2 {
      margin: 0 0 20px;
      font-size: 2rem;
      letter-spacing: 1px;
      color: #222;
    }

    button {
      border: none;
      background: #111;
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="colorBox" class="color-box"></div>
    <h2 id="hexValue">#FFFFFF</h2>
    <button onclick="generateColour()">Generate Colour</button>
  </div>

  <script>
    function generateColour() {
      const randomColour = '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0').toUpperCase();
      document.body.style.background = randomColour;
      document.getElementById('colorBox').style.background = randomColour;
      document.getElementById('hexValue').textContent = randomColour;
    }

    generateColour();
  </script>
</body>
</html>
