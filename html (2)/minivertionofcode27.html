<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Chrome Detect</title><style>body{font-family:sans-serif;margin:2rem;background:#f4f4f9;color:#333}#status{padding:1rem;border-radius:.5rem;background:#fff;border:1px solid #ddd}.chrome{background:#e8f5ff;border-color:#b3e5fc;color:#0277bd}.other{background:#fff1f0;border-color:#ffcccb;color:#c62828}</style></head><body><div id="status">Detecting browser…</div><script>const status=document.getElementById('status');const isChrome=/Chrome/.test(navigator.userAgent)&&/Google Inc/.test(navigator.vendor);status.textContent=isChrome?'You are using Google Chrome.':'You are not using Google Chrome.';status.className=isChrome?'chrome':'other';</script></body></html>
