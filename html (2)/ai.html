<!DOCTYPE html>
<html>
<head>
    <title>Simple AI Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        #chatbox {
            width: 400px;
            height: 300px;
            border: 1 px solid #00b3ff;
            margin: auto;
            padding: 10px;
            overflow-y: auto;
            text-align: left;
        }

        input {
            width: 300px;
            padding: 10px;
        }

        button {
            padding: 10px 20px;
        }
    </style>
</head>
<body>

    <h1>Simple AI Chatbot</h1>

    <div id="chatbox">
        <p><b>AI Bot:</b> Hello! Type 'bye' to exit.</p>
    </div>

    <br>

    <input type="text" id="userInput" placeholder="Type a message...">
    <button onclick="sendMessage()">Send</button>

    <script>
        function sendMessage() {
            let input = document.getElementById("userInput");
            let user = input.value.toLowerCase();
            let chatbox = document.getElementById("chatbox");

            if (user.trim() === "") return;

            chatbox.innerHTML += `<p><b>You:</b> ${input.value}</p>`;

            let response;

            if (user === "hello") {
                response = "Hi! How are you?";
            } else if (user === "how are you") {
                response = "I'm fine";
            } else if (user === "what is your name") {
                response = "I am a simple AI chatbot.";
            } else if (user === "what is lion") {
                response = "Lion is the king of forest";
            } else {
                response = "google";

            chatbox.innerHTML += `<p><b>AI Bot:</b> ${response}</p>`;

            chatbox.scrollTop = chatbox.scrollHeight;
            input.value = "";
        }
    </script>
</body>
</html>
