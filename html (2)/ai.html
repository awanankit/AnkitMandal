<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intelligent AI Assistant</title>
  <style>
    :root {
      --bg1: #07111f;
      --bg2: #0d1b2a;
      --panel: rgba(15, 23, 42, 0.9);
      --panel-2: rgba(30, 41, 59, 0.9);
      --primary: #6ee7f9;
      --secondary: #a78bfa;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #34d399;
      --danger: #f87171;
      --shadow: rgba(15, 23, 42, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: min(100%, 980px);
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 24px;
      box-shadow: 0 25px 70px var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(8px);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 28px;
      background: linear-gradient(90deg, rgba(110, 231, 249, 0.14), rgba(167, 139, 250, 0.12));
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #05131f;
      font-size: 1.2rem;
      font-weight: 900;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(52, 211, 153, 0.12);
      color: var(--accent);
      border: 1px solid rgba(52, 211, 153, 0.3);
      font-size: 0.82rem;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px rgba(52, 211, 153, 0.9);
    }

    .chat-box {
      height: 450px;
      overflow-y: auto;
      padding: 24px 22px;
      background: rgba(8, 15, 27, 0.52);
    }

    .message {
      display: flex;
      margin-bottom: 18px;
      animation: fadeIn 0.35s ease;
    }

    .message.user { justify-content: flex-end; }

    .bubble {
      max-width: min(75%, 600px);
      padding: 14px 16px;
      border-radius: 18px;
      line-height: 1.5;
      font-size: 0.98rem;
      box-shadow: 0 10px 18px rgba(0, 0, 0, 0.12);
    }

    .message.user .bubble {
      background: linear-gradient(135deg, var(--primary), #7dd3fc);
      color: #072033;
      border-bottom-right-radius: 6px;
    }

    .message.ai .bubble {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-bottom-left-radius: 6px;
    }

    .composer {
      display: flex;
      gap: 14px;
      padding: 18px 20px 22px;
      border-top: 1px solid rgba(148, 163, 184, 0.15);
      background: rgba(15, 23, 42, 0.9);
    }

    textarea {
      flex: 1;
      resize: none;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      border-radius: 14px;
      padding: 14px 16px;
      min-height: 54px;
      max-height: 150px;
      font-size: 1rem;
      outline: none;
    }

    textarea:focus {
      border-color: rgba(110, 231, 249, 0.9);
      box-shadow: 0 0 0 3px rgba(110, 231, 249, 0.12);
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 0 22px;
      min-width: 120px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #061a2b;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      box-shadow: 0 12px 26px rgba(110, 231, 249, 0.25);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(167, 139, 250, 0.26);
    }

    button:active { transform: translateY(0); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      .header { padding: 18px 16px; }
      .brand { font-size: 0.94rem; }
      .composer { flex-direction: column; }
      button { width: 100%; min-height: 52px; }
      .bubble { max-width: 88%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="brand">
        <div class="logo">AI</div>
        <span>Intelligent AI</span>
      </div>
      <div class="status"><span class="dot"></span> Online</div>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="message ai">
        <div class="bubble">Hello! I am your intelligent AI assistant. Ask me anything, and I will help you think, create, or solve problems.</div>
      </div>
    </div>

    <div class="composer">
      <textarea id="userInput" rows="1" placeholder="Type your message here..."></textarea>
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById('chatBox');
    const input = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    function appendMessage(sender, text) {
      const msg = document.createElement('div');
      msg.className = `message ${sender}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      msg.appendChild(bubble);
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function generateReply(userText) {
      const text = userText.toLowerCase().trim();

      if (!text) return 'I am here and ready to help.';

      if (text.includes('hello') || text.includes('hi')) return 'Hello! How can I assist you today?';
      if (text.includes('how are you')) return 'I am doing great. I am powered by logic, creativity, and a lot of curiosity.';
      if (text.includes('name')) return 'I am your Intelligent AI Assistant.';
      if (text.includes('code') || text.includes('program')) return 'I can help with coding, debugging, logic design, and building smart solutions.';
      if (text.includes('solve') || text.includes('problem')) return 'Tell me the problem clearly, and I will break it into smaller steps and suggest the best solution.';
      if (text.includes('ai')) return 'AI is the simulation of intelligence that can learn, reason, analyze, and respond in useful ways.';
      if (text.includes('plan') || text.includes('strategy')) return 'A strong plan starts with a clear goal, then a step-by-step path, followed by testing and improvement.';
      if (text.includes('thank')) return 'You are welcome! I am always here to help.';
      if (text.includes('future')) return 'The future of AI is about smarter automation, deeper personalization, and better decision-making.';

      return 'That is interesting. I can help you think through it, organize your idea, or turn it into a smart solution.';
    }

    function sendMessage() {
      const message = input.value.trim();
      if (!message) return;

      appendMessage('user', message);
      input.value = '';
      input.style.height = '54px';

      setTimeout(() => {
        appendMessage('ai', generateReply(message));
      }, 500);
    }

    sendBtn.addEventListener('click', sendMessage);

    input.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    input.addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
    });
  </script>
</body>
</html>
