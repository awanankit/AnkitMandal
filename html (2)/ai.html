<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catch the Ball</title>
  <style>
    :root {
      --bg1: #07111f;
      --bg2: #0d1b2a;
      --panel: rgba(15, 23, 42, 0.9);
      --panel-2: rgba(30, 41, 59, 0.9);
      --primary: #6ee7f9;
      --secondary: #a78bfa;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #34d399;
      --danger: #f87171;
      --shadow: rgba(15, 23, 42, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: min(100%, 980px);
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 24px;
      box-shadow: 0 25px 70px var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(8px);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 28px;
      background: linear-gradient(90deg, rgba(110, 231, 249, 0.14), rgba(167, 139, 250, 0.12));
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #05131f;
      font-size: 1.2rem;
      font-weight: 900;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(52, 211, 153, 0.12);
      color: var(--accent);
      border: 1px solid rgba(52, 211, 153, 0.3);
      font-size: 0.82rem;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px rgba(52, 211, 153, 0.9);
    }

    .chat-box {
      height: 450px;
      overflow-y: auto;
      padding: 24px 22px;
      background: rgba(8, 15, 27, 0.52);
    }

    .message {
      display: flex;
      margin-bottom: 18px;
      animation: fadeIn 0.35s ease;
    }

    .message.user { justify-content: flex-end; }

    .bubble {
      max-width: min(75%, 600px);
      padding: 14px 16px;
      border-radius: 18px;
      line-height: 1.5;
      font-size: 0.98rem;
      box-shadow: 0 10px 18px rgba(0, 0, 0, 0.12);
    }

    .message.user .bubble {
      background: linear-gradient(135deg, var(--primary), #7dd3fc);
      color: #072033;
      border-bottom-right-radius: 6px;
    }

    .message.ai .bubble {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-bottom-left-radius: 6px;
    }

    .composer {
      display: flex;
      gap: 14px;
      padding: 18px 20px 22px;
      border-top: 1px solid rgba(148, 163, 184, 0.15);
      background: rgba(15, 23, 42, 0.9);
    }

    textarea {
      flex: 1;
      resize: none;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      border-radius: 14px;
      padding: 14px 16px;
      min-height: 54px;
      max-height: 150px;
      font-size: 1rem;
      outline: none;
    }

    textarea:focus {
      border-color: rgba(110, 231, 249, 0.9);
      box-shadow: 0 0 0 3px rgba(110, 231, 249, 0.12);
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 0 22px;
      min-width: 120px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #061a2b;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      box-shadow: 0 12px 26px rgba(110, 231, 249, 0.25);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(167, 139, 250, 0.26);
    }

    button:active { transform: translateY(0); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      .header { padding: 18px 16px; }
      .brand { font-size: 0.94rem; }
      .composer { flex-direction: column; }
      button { width: 100%; min-height: 52px; }
      .bubble { max-width: 88%; }
    }

    .app { width: min(100%, 760px); }
    .header { gap: 12px; }
    .game-title { font-size: 1.05rem; }
    .game-area {
      position: relative;
      height: min(58vh, 440px);
      min-height: 300px;
      overflow: hidden;
      touch-action: none;
      cursor: crosshair;
      background: radial-gradient(ellipse at 50% 110%, #164e63 0%, #0b2740 48%, #081323 100%);
    }
    .game-area::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
    }
    .ball {
      position: absolute;
      top: 20px;
      left: 50%;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #fff 0 7%, #fde68a 8% 35%, #f97316 70%, #c2410c 100%);
      box-shadow: 0 0 24px rgba(251, 146, 60, .65);
      transform: translateX(-50%);
      display: none;
    }
    .paddle {
      position: absolute;
      bottom: 18px;
      left: 50%;
      width: 112px;
      height: 18px;
      border-radius: 12px 12px 8px 8px;
      background: linear-gradient(90deg, #6ee7f9, #a78bfa);
      box-shadow: 0 0 20px rgba(110, 231, 249, .45);
      transform: translateX(-50%);
    }
    .game-hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 20px;
      background: rgba(15, 23, 42, .9);
      color: var(--muted);
    }
    .game-hud strong { color: var(--text); }
    .game-hud button { min-height: 44px; }
    .game-help {
      margin: 0;
      padding: 0 20px 18px;
      background: rgba(15, 23, 42, .9);
      color: var(--muted);
      font-size: .88rem;
      text-align: center;
    }
    @media (max-width: 520px) {
      .game-hud { flex-wrap: wrap; justify-content: center; }
      .game-hud button { width: auto; min-width: 110px; }
      .game-area { min-height: 280px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand">
        <div class="logo" aria-hidden="true">●</div>
        <span class="game-title">Catch the Ball</span>
      </div>
      <div class="status"><span class="dot"></span> Ready to play</div>
    </header>

    <section class="game-area" id="gameArea" aria-label="Ball catching game">
      <div class="ball" id="ball" aria-label="Ball"></div>
      <div class="paddle" id="paddle" aria-label="Catcher"></div>
    </section>
    <div class="game-hud">
      <span>Score: <strong id="score">0</strong></span>
      <span>Time: <strong id="time">30</strong>s</span>
      <button id="startBtn" type="button">Start game</button>
    </div>
    <p class="game-help" id="message">Move the catcher with your mouse, touch, or ← → keys. Catch as many balls as you can!</p>
  </main>

  <script>
    const area = document.getElementById('gameArea');
    const ball = document.getElementById('ball');
    const paddle = document.getElementById('paddle');
    const scoreDisplay = document.getElementById('score');
    const timeDisplay = document.getElementById('time');
    const startBtn = document.getElementById('startBtn');
    const message = document.getElementById('message');
    let score = 0;
    let seconds = 30;
    let ballX = 0;
    let ballY = 20;
    let ballSpeed = 3;
    let paddleX = 0;
    let running = false;
    let frameId;
    let timerId;
    const ballSize = 34;
    const paddleWidth = 112;

    function setPaddle(x) {
      const max = area.clientWidth - paddleWidth / 2;
      paddleX = Math.max(paddleWidth / 2, Math.min(max, x));
      paddle.style.left = paddleX + 'px';
    }

    function resetBall() {
      ballX = ballSize / 2 + Math.random() * (area.clientWidth - ballSize);
      ballY = 20;
      ballSpeed = 3 + Math.min(score * 0.12, 4);
      ball.style.left = ballX + 'px';
      ball.style.top = ballY + 'px';
    }

    function finishGame() {
      running = false;
      cancelAnimationFrame(frameId);
      clearInterval(timerId);
      ball.style.display = 'none';
      startBtn.textContent = 'Play again';
      message.textContent = `Time's up! You caught ${score} ${score === 1 ? 'ball' : 'balls'}. Tap Play again to try once more.`;
    }

    function tick() {
      if (!running) return;
      ballY += ballSpeed;
      ball.style.top = ballY + 'px';
      if (ballY + ballSize >= area.clientHeight - 18 && ballY < area.clientHeight - 18) {
        if (ballX >= paddleX - paddleWidth / 2 - ballSize / 2 && ballX <= paddleX + paddleWidth / 2 + ballSize / 2) {
          score++;
          scoreDisplay.textContent = score;
          resetBall();
        }
      }
      if (ballY > area.clientHeight) resetBall();
      frameId = requestAnimationFrame(tick);
    }

    function startGame() {
      cancelAnimationFrame(frameId);
      clearInterval(timerId);
      score = 0;
      seconds = 30;
      scoreDisplay.textContent = score;
      timeDisplay.textContent = seconds;
      running = true;
      ball.style.display = 'block';
      startBtn.textContent = 'Playing...';
      message.textContent = 'Catch the falling balls!';
      setPaddle(area.clientWidth / 2);
      resetBall();
      tick();
      timerId = setInterval(() => {
        seconds--;
        timeDisplay.textContent = seconds;
        if (seconds <= 0) finishGame();
      }, 1000);
    }

    area.addEventListener('pointermove', event => {
      const rect = area.getBoundingClientRect();
      setPaddle(event.clientX - rect.left);
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft' || event.key.toLowerCase() === 'a') setPaddle(paddleX - 28);
      if (event.key === 'ArrowRight' || event.key.toLowerCase() === 'd') setPaddle(paddleX + 28);
    });
    startBtn.addEventListener('click', startGame);
    setPaddle(area.clientWidth / 2);
    window.addEventListener('resize', () => setPaddle(Math.min(paddleX, area.clientWidth - paddleWidth / 2)));
  </script>
</body>
</html>
