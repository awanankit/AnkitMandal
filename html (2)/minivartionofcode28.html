<!DOCTYPE html><html><head><title>Guessing Game</title><style>body {background-color: #f0f8ff;font-family: Arial;text-align: center;padding: 10px;}h1 {color: #ff4500;font-size: 20px;margin: 10px 0;}input {padding: 5px;font-size: 14px;border: 2px solid #32cd32;border-radius: 3px;width: 80px;}button {padding: 5px 15px;font-size: 14px;background-color: #32cd32;color: white;border: none;border-radius: 3px;cursor: pointer;}button:hover {background-color: #228b22;}#result {font-size: 16px;font-weight: bold;margin-top: 10px;height: 20px;}</style></head><body><h1>Guess 1-100</h1><input type="number" id="guess"><button onclick="checkGuess()">Guess</button><p id="result"></p><script>let number = Math.floor(Math.random() * 100) + 1;function checkGuess() {let guess = document.getElementById('guess').value;let result = document.getElementById('result');if (guess == number) {result.textContent = 'Correct!';result.style.color = '#32cd32';} else if (guess < number) {result.textContent = 'Too low!';result.style.color = '#ff4500';} else {result.textContent = 'Too high!';result.style.color = '#ff4500';}}</script></body></html>
