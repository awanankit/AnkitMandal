
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Glowing Sword Tracker</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    overflow: hidden;
    background: #02040c;
    font-family: Arial, sans-serif;
    color: white;
}

#scene {
    position: fixed;
    inset: 0;
}

#ui {
    position: fixed;
    top: 25px;
    left: 30px;
    z-index: 5;
    pointer-events: none;
}

h1 {
    font-size: 27px;
    letter-spacing: 4px;
    color: #8eeeff;
    text-shadow: 0 0 20px #00aaff;
}

#status {
    margin-top: 12px;
    color: #8eeeff;
    font-size: 13px;
    letter-spacing: 2px;
}

#camera {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 180px;
    border: 2px solid #00cfff;
    border-radius: 12px;
    transform: scaleX(-1);
    box-shadow: 0 0 20px #0077ff66;
}

#start {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    padding: 17px 35px;
    border: 1px solid #00d9ff;
    border-radius: 30px;
    background: #031a30;
    color: white;
    font-size: 16px;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 0 25px #00aaff;
    z-index: 10;
}

#instructions {
    position: fixed;
    bottom: 25px;
    left: 30px;
    color: #8baabd;
    font-size: 12px;
    line-height: 2;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
  }
}
</script>
</head>

<body>

<div id="scene"></div>

<div id="ui">
    <h1>PLASMA SWORD</h1>
    <div id="status">SYSTEM READY</div>
</div>

<div id="instructions">
    MOVE HAND : MOVE SWORD<br>
    ROTATE HAND : ROTATE SWORD<br>
    OPEN PALM : POWER GLOW<br>
    MAKE FIST : ENERGY MODE
</div>

<video id="camera" autoplay playsinline></video>

<button id="start">ACTIVATE HAND TRACKER</button>

<script type="module">

import * as THREE from "three";

import {
  HandLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02040c);
scene.fog = new THREE.FogExp2(0x02040c, 0.025);

const camera3D = new THREE.PerspectiveCamera(
    45,
    innerWidth / innerHeight,
    0.1,
    100
);

camera3D.position.set(0, 0, 12);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.4;

document.getElementById("scene").appendChild(renderer.domElement);

// LIGHTING

scene.add(new THREE.AmbientLight(0x5577aa, 1.5));

const mainLight = new THREE.PointLight(0x00bbff, 100, 20);
mainLight.position.set(0, 2, 4);
scene.add(mainLight);

// SWORD GROUP

const sword = new THREE.Group();
scene.add(sword);

// BLADE

const bladeShape = new THREE.Shape();

bladeShape.moveTo(-0.20, 0);
bladeShape.lineTo(0.20, 0);
bladeShape.lineTo(0.14, 2.65);
bladeShape.lineTo(0, 3.15);
bladeShape.lineTo(-0.14, 2.65);
bladeShape.closePath();

const bladeGeometry = new THREE.ExtrudeGeometry(
    bladeShape,
    {
        depth: 0.12,
        bevelEnabled: true,
        bevelSegments: 4,
        steps: 1,
        bevelSize: 0.035,
        bevelThickness: 0.04
    }
);

const bladeMaterial = new THREE.MeshStandardMaterial({
    color: 0x8cefff,
    emissive: 0x008cff,
    emissiveIntensity: 3,
    metalness: 0.9,
    roughness: 0.15
});

const blade = new THREE.Mesh(bladeGeometry, bladeMaterial);
blade.position.y = -0.15;
sword.add(blade);

// BLADE CORE

const coreGeometry = new THREE.BoxGeometry(0.045, 2.65, 0.025);

const coreMaterial = new THREE.MeshBasicMaterial({
    color: 0xffffff
});

const core = new THREE.Mesh(coreGeometry, coreMaterial);
core.position.set(0, 1.18, 0.15);
sword.add(core);

// GUARD

const guard = new THREE.Mesh(
    new THREE.BoxGeometry(0.95, 0.13, 0.22),
    new THREE.MeshStandardMaterial({
        color: 0x00bfff,
        emissive: 0x0088ff,
        emissiveIntensity: 2,
        metalness: 0.8
    })
);

guard.position.y = -0.25;
sword.add(guard);

// HANDLE

const handle = new THREE.Mesh(
    new THREE.CylinderGeometry(0.085, 0.085, 0.8, 16),
    new THREE.MeshStandardMaterial({
        color: 0x182b48,
        metalness: 0.9,
        roughness: 0.3
    })
);

handle.position.y = -0.72;
sword.add(handle);

// HANDLE RINGS

for (let i = 0; i < 5; i++) {
    const ring = new THREE.Mesh(
        new THREE.TorusGeometry(0.09, 0.018, 8, 24),
        new THREE.MeshBasicMaterial({color: 0x00ccff})
    );

    ring.position.y = -0.42 - i * 0.14;
    sword.add(ring);
}

// HANDLE BASE

const pommel = new THREE.Mesh(
    new THREE.SphereGeometry(0.14, 24, 24),
    new THREE.MeshStandardMaterial({
        color: 0x00aaff,
        emissive: 0x0066ff,
        emissiveIntensity: 3
    })
);

pommel.position.y = -1.18;
sword.add(pommel);

// GLOW LIGHT

const swordLight = new THREE.PointLight(0x00aaff, 35, 6);
sword.add(swordLight);
swordLight.position.set(0, 1.2, 0.5);

// BACKGROUND STARS

const starGeometry = new THREE.BufferGeometry();
const starPositions = [];

for (let i = 0; i < 1800; i++) {
    starPositions.push(
        (Math.random() - 0.5) * 35,
        (Math.random() - 0.5) * 25,
        -Math.random() * 18
    );
}

starGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(starPositions, 3)
);

const stars = new THREE.Points(
    starGeometry,
    new THREE.PointsMaterial({
        color: 0x55ccff,
        size: 0.025
    })
);

scene.add(stars);

// HAND TRACKING

const video = document.getElementById("camera");
const statusText = document.getElementById("status");

let handTracker = null;
let tracking = false;

let targetX = 0;
let targetY = 0;
let targetRotation = 0;
let power = 1;

function distance(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
}

async function startTracker() {

    const button = document.getElementById("start");
    button.textContent = "LOADING CAMERA...";

    try {

        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                width: 640,
                height: 480
            }
        });

        video.srcObject = stream;
        await video.play();

        const vision = await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );

        handTracker = await HandLandmarker.createFromOptions(
            vision,
            {
                baseOptions: {
                    modelAssetPath:
                    "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numHands: 1
            }
        );

        tracking = true;
        button.style.display = "none";

        statusText.textContent = "HAND TRACKING ACTIVE";

    } catch (error) {

        statusText.textContent = "CAMERA ERROR - CHECK PERMISSIONS";
        button.textContent = "TRY AGAIN";
        console.error(error);

    }
}

document.getElementById("start").addEventListener(
    "click",
    startTracker
);

// DETECT HAND

let lastVideoTime = -1;

function detectHand() {

    if (
        tracking &&
        handTracker &&
        video.readyState >= 2 &&
        video.currentTime !== lastVideoTime
    ) {

        lastVideoTime = video.currentTime;

        const results = handTracker.detectForVideo(
            video,
            performance.now()
        );

        if (results.landmarks.length > 0) {

            const lm = results.landmarks[0];

            // INDEX FINGER POSITION
            const index = lm[8];

            targetX = (0.5 - index.x) * 10;
            targetY = (0.5 - index.y) * 7;

            // HAND ROTATION
            const wrist = lm[0];
            const middle = lm[9];

            targetRotation = Math.atan2(
                middle.x - wrist.x,
                -(middle.y - wrist.y)
            );

            // OPEN HAND / FIST DETECTION
            const wristPoint = lm[0];

            const tips = [8, 12, 16, 20];

            let openness = 0;

            tips.forEach(i => {
                openness += distance(lm[i], wristPoint);
            });

            openness /= tips.length;

            power = THREE.MathUtils.clamp(
                (openness - 0.18) * 7,
                0.3,
                2.5
            );

            if (openness < 0.23) {
                statusText.textContent = "ENERGY MODE";
            } else {
                statusText.textContent = "PLASMA POWER: " +
                    Math.round(power * 40) + "%";
            }

        } else {
            statusText.textContent = "SHOW YOUR HAND";
        }
    }
}

// ANIMATION

const clock = new THREE.Clock();

function animate() {

    requestAnimationFrame(animate);

    const time = clock.getElapsedTime();

    detectHand();

    // Smooth hand movement
    sword.position.x = THREE.MathUtils.lerp(
        sword.position.x,
        targetX,
        0.12
    );

    sword.position.y = THREE.MathUtils.lerp(
        sword.position.y,
        targetY,
        0.12
    );

    sword.rotation.z = THREE.MathUtils.lerp(
        sword.rotation.z,
        targetRotation,
        0.12
    );

    // Glow animation
    bladeMaterial.emissiveIntensity =
        power * (2.5 + Math.sin(time * 4) * 0.5);

    swordLight.intensity = power * 35;

    // Floating animation
    sword.position.z = Math.sin(time * 1.5) * 0.15;

    // Background animation
    stars.rotation.y = time * 0.015;

    renderer.render(scene, camera3D);
}

animate();

// RESIZE

window.addEventListener("resize", () => {

    camera3D.aspect = innerWidth / innerHeight;
    camera3D.updateProjectionMatrix();

    renderer.setSize(innerWidth, innerHeight);

});

</script>
</body>
</html>
